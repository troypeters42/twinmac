# Tiny Tapeout project information
project:
  title: "TwinMAC"
  author: "Gabriel Hoda, Troy Peters, Nicholas Grieco"
  discord: ""
  description: "Two-unit neural accelerator that computes logic gates"
  language: "SystemVerilog"
  clock_hz: 50000000
  tiles: "1x2"
  top_module: "tt_um_troypeters42_twinmac"
  source_files:
